log4j.rootLogger=INFO,Console,File

#控制台日志
log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.Target=System.out
log4j.appender.Console.layout=org.apache.log4j.PatternLayout
log4j.appender.Console.layout.ConversionPattern=[%p] [%d{yyyy-MM-dd HH\:mm\:ss,SSS}] [%l]%m%n

#文件日志
log4j.appender.File=org.apache.log4j.DailyRollingFileAppender
log4j.appender.File.File=logs/zheng-seckill-web.log
log4j.appender.File.DatePattern='.'yyyy-MM-dd
log4j.appender.File.layout=org.apache.log4j.PatternLayout
log4j.appender.File.layout.ConversionPattern=[%p] [%d{yyyy-MM-dd HH\:mm\:ss,SSS}] [%l]%m%n

#自定义日志级别
log4j.logger.com.zheng.seckill=DEBUG
log4j.logger.org.springframework=WARN
log4j.logger.org.mybatis=WARN
log4j.logger.com.alibaba=WARN
log4j.logger.org.apache.activemq=WARN
log4j.logger.redis.clients=WARN
log4j.logger.com.alibaba.dubbo=WARN

# 系统配置
system.name=zheng-seckill
system.version=1.0.0

# ActiveMQ配置
activemq.brokerURL=tcp://127.0.0.1:61616
activemq.userName=admin
activemq.password=admin

# 秒杀配置
# 默认限流数量（每秒）
seckill.limit.default=100
# 库存超时时间（秒）
seckill.stock.timeout=60
# 分布式锁超时时间（毫秒）
seckill.lock.timeout=10000
# 消息最大重试次数
seckill.message.max.retry=3

# SSO配置
# SSO登录URL
sso.login.url=http://127.0.0.1:8080/sso/login
# SSO登出URL
sso.logout.url=http://127.0.0.1:8080/sso/logout
# SSO校验URL
sso.validate.url=http://127.0.0.1:8080/sso/validate
